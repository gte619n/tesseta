steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    # Triggered builds check out the full repo at /workspace; dir scopes
    # the docker build context to /workspace/web so the Dockerfile
    # resolves correctly. (Manual `gcloud builds submit web/` uploads
    # just the subdir as /workspace, where this `dir` is a no-op.)
    dir: web
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/health-fitness/web:$SHORT_SHA
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/health-fitness/web:latest
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - us-central1-docker.pkg.dev/$PROJECT_ID/health-fitness/web

  # Vulnerability scan before shipping — fail on fixable HIGH/CRITICAL findings.
  - id: scan-image
    name: aquasec/trivy:0.58.1
    args:
      - image
      - --severity=HIGH,CRITICAL
      - --ignore-unfixed
      - --exit-code=1
      - us-central1-docker.pkg.dev/$PROJECT_ID/health-fitness/web:$SHORT_SHA

  # Canary deploy: new revision up under the `candidate` tag with zero traffic.
  - id: deploy-candidate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - health-fitness-web
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/health-fitness/web:$SHORT_SHA
      - --region=us-central1
      - --platform=managed
      - --service-account=health-fitness-runtime@$PROJECT_ID.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --port=8080
      - --no-traffic
      - --tag=candidate
      # BACKEND_URL is what lib/api.ts and auth.ts read. The previous
      # cloudbuild used BACKEND_BASE_URL which did not match the code, so
      # the deployed web couldn't reach the backend.
      # AUTH_TRUST_HOST=true tells Auth.js v5 to accept proxied host
      # headers. AUTH_URL pins the canonical base URL so Auth.js doesn't
      # fall back to the container's bind hostname (0.0.0.0 from the
      # Dockerfile's ENV HOSTNAME) when building callback URLs.
      - --set-env-vars=BACKEND_URL=https://api.tesseta.com,AUTH_TRUST_HOST=true,AUTH_URL=https://app.tesseta.com
      # AUTH_GOOGLE_* feed Auth.js; AUTH_SECRET encrypts the session
      # cookie. Without these the next-auth handlers throw on every
      # request to /api/auth/* and the body-comp connect flow can't
      # complete its OAuth round-trip.
      - --set-secrets=AUTH_GOOGLE_ID=oauth-web-client-id:latest,AUTH_GOOGLE_SECRET=oauth-web-client-secret:latest,AUTH_SECRET=authjs-secret:latest

  # Smoke-test the candidate and only then shift 100% traffic to it. The web root
  # redirects to sign-in, so the smoke check accepts any 2xx/3xx.
  - id: promote-canary
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    env:
      - PROJECT_ID=$PROJECT_ID
    args:
      - infra/scripts/canary-promote.sh
      - health-fitness-web
      - us-central1
      - /

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/health-fitness/web:$SHORT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/health-fitness/web:latest

options:
  logging: CLOUD_LOGGING_ONLY
