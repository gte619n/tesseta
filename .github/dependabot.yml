# Dependency + action update automation. Keeps the three stacks and the CI
# actions patched instead of drifting.
#
# Grouping: each group bundles only MINOR + PATCH updates, so the routine group
# PR stays green and easy to merge. MAJOR updates are NOT grouped — Dependabot
# raises them as individual PRs so each breaking migration (e.g. Spring Boot 4,
# Next.js 16) is reviewed and done deliberately, one at a time, rather than
# poisoning the whole group PR.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      backend-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      android-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      web-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
