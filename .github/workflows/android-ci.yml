name: android-ci

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'android/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      - name: Assemble + unit tests + release build
        # The app build now requires a real WEB OAuth client ID (it fails the
        # build rather than embedding an empty audience). The web client ID is
        # a public identifier, supplied here via the repo variable so CI builds
        # a signable APK without gcloud/Secret Manager access.
        #
        # Two Phase-0 changes close the release blind-spot:
        #  - testDebugUnitTest (no :app: prefix) runs EVERY module's unit tests,
        #    not just :app — this is what gates the SyncEngine/ConflictResolver/
        #    outbox/DbKeystore/chat suites that previously never ran in CI.
        #  - :app:assembleRelease builds the R8-minified, arm64-only variant so
        #    R8/Moshi reflection breakage (e.g. the workout-designer SSE DTOs)
        #    surfaces pre-merge instead of only in a shipped APK.
        env:
          WEB_OAUTH_CLIENT_ID: ${{ vars.WEB_OAUTH_CLIENT_ID }}
        run: >-
          ./gradlew
          :app:assembleDebug :wear:assembleDebug
          testDebugUnitTest
          :app:assembleRelease
          --no-daemon

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/**/build/reports/tests/
          if-no-files-found: warn
