name: android-ci

# CICD-001: this workflow now ALWAYS runs on pull_request to main (no top-level
# `paths:` gate on the trigger) so it reports a conclusion on every PR and a
# branch ruleset can safely require it. A first `changes` guard job detects
# whether android/ (or this workflow) was touched; the heavy jobs `needs:` it
# and short-circuit to success when nothing relevant changed. Net effect: a
# docs-only PR still gets a green android-ci; a real android change still runs
# the full suite and can still fail.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A force-push to a PR obsoletes the in-flight run; cancel it instead of
# queueing behind it. Main pushes never cancel each other (every merge must
# report a real status).
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The two jobs deliberately share almost nothing: `test` builds only debug
# variants, `release` only the R8-minified release variant, so running them
# serially (the old single job) just added their wall times together.
# Splitting them puts the R8/lint-vital long pole on its own runner.
jobs:
  # Early-exit guard. Reports quickly and always succeeds; its `changed` output
  # tells the heavy jobs whether to run. On a push to main we force changed=true
  # (belt-and-braces: main must always exercise the real build).
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Detect android changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          # On push events paths-filter compares against the previous commit;
          # for PRs it diffs against the base ref. If the filter can't resolve
          # a base (rare), it defaults to changed, which fails safe (runs).
          filters: |
            android:
              - 'android/**'
              - '.github/workflows/android-ci.yml'

  test:
    name: debug + unit tests
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      # Replaces the hand-rolled actions/cache block: setup-gradle keys per-job,
      # cleans stale entries before saving (the old whole-dir tarball only ever
      # grew), and includes the local build cache so unchanged modules' compile
      # tasks are cache hits even on a first PR build. PRs are read-only so a
      # branch can't evict the caches seeded by main.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # testDebugUnitTest (no :app: prefix) runs EVERY module's unit tests —
      # this is what gates the SyncEngine/ConflictResolver/outbox/DbKeystore/
      # chat suites — and its task graph already covers all debug compilation,
      # KSP/Hilt, resource and manifest processing. Full :app:/:wear:
      # assembleDebug is deliberately NOT run: nothing consumes the debug APKs
      # in CI, and the packaging tail (dex/merge/sign/zip) can't fail once
      # compilation passes — except duplicate runtime classes, so that one
      # check is kept. It uniquely gates debugImplementation-only deps (e.g.
      # compose-ui-tooling) that the release build never packages.
      #
      # The app build requires a real WEB OAuth client ID (it fails rather
      # than embedding an empty audience); the web client ID is a public
      # identifier, supplied via the repo variable so CI configures without
      # gcloud/Secret Manager access.
      - name: Unit tests + duplicate-class check
        env:
          WEB_OAUTH_CLIENT_ID: ${{ vars.WEB_OAUTH_CLIENT_ID }}
        run: >-
          ./gradlew
          testDebugUnitTest
          :app:checkDebugDuplicateClasses :wear:checkDebugDuplicateClasses

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-reports
          path: android/**/build/reports/tests/
          if-no-files-found: warn

  release:
    name: release build (R8)
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # :app:assembleRelease builds the R8-minified, arm64-only variant so
      # R8/Moshi reflection breakage (e.g. the workout-designer SSE DTOs)
      # surfaces pre-merge instead of only in a shipped APK.
      - name: Release build
        env:
          WEB_OAUTH_CLIENT_ID: ${{ vars.WEB_OAUTH_CLIENT_ID }}
        run: ./gradlew :app:assembleRelease

  # Aggregate gate: one stable check name for the ruleset to require, regardless
  # of how many heavy jobs exist or whether they were skipped. It succeeds when
  # the component was unchanged (heavy jobs skipped) OR all heavy jobs passed,
  # and fails if any heavy job failed. `if: always()` ensures it runs even when
  # upstream jobs are skipped.
  android-ci:
    name: android-ci
    needs: [changes, test, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on heavy job results
        run: |
          echo "test=${{ needs.test.result }} release=${{ needs.release.result }}"
          for r in "${{ needs.test.result }}" "${{ needs.release.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "A required android job did not pass"; exit 1 ;;
            esac
          done
          echo "android-ci gate passed"
