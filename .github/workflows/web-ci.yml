name: web-ci

# CICD-001: always runs on pull_request to main (no top-level `paths:` gate) so
# it reports a conclusion on every PR and a branch ruleset can require it. The
# `changes` guard detects whether web/ (or this workflow) was touched; the heavy
# build job `needs:` it and short-circuits to success when unchanged. The
# `web-ci` aggregate job is the single stable check name the ruleset requires.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Detect web changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/web-ci.yml'

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        # Fail only on high/critical advisories in shipped (prod) deps; dev-only
        # tooling advisories don't block. Dependabot handles the routine bumps.
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Page-title guard
        run: pnpm check:titles

      - name: Unit tests (Vitest)
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-coverage
          path: web/coverage/coverage-final.json
          if-no-files-found: warn

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore

  # Aggregate gate: one stable check name for the ruleset. Succeeds when web was
  # unchanged (build skipped) OR build passed; fails if build failed.
  web-ci:
    name: web-ci
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on build result
        run: |
          echo "build=${{ needs.build.result }}"
          case "${{ needs.build.result }}" in
            success|skipped) echo "web-ci gate passed" ;;
            *) echo "The web build did not pass"; exit 1 ;;
          esac
