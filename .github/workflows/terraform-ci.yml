name: terraform-ci

# Validates the infra-as-code on every change. fmt + validate need no cloud
# credentials (init runs with -backend=false). `terraform plan` requires GCP
# auth and is run manually against the remote state — see infra/README.md.
on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-ci.yml'
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: "1.12.3"

      - name: Format check
        run: tofu fmt -check -recursive

      - name: Init (no backend)
        run: tofu init -backend=false -input=false

      - name: Validate
        run: tofu validate
