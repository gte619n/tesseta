name: terraform-ci

# Validates the infra-as-code on every change. fmt + validate need no cloud
# credentials (init runs with -backend=false). `terraform plan` requires GCP
# auth and is run manually against the remote state — see infra/README.md.
on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-ci.yml'
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.12.3"

      - name: Format check
        run: tofu fmt -check -recursive

      - name: Init (no backend)
        run: tofu init -backend=false -input=false

      - name: Validate
        run: tofu validate
