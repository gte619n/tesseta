name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'website/public/api/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'website/public/api/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/**/*.gradle*', 'backend/**/gradle-wrapper.properties', 'backend/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # The Firestore-emulator integration tests (tag "firestore-emulator") boot
      # the emulator via the firebase CLI — no Docker. GitHub sets CI=true, which
      # flips firestore.emulator.required so a missing CLI fails the build rather
      # than silently skipping the integration suite.
      - name: Install firebase CLI
        run: npm install -g firebase-tools

      - name: Build (unit + emulator integration + coverage)
        run: ./gradlew build jacocoTestReport --no-daemon

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-jacoco
          path: backend/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: warn

  # Fail a PR that changes the published /v1 contract in a backward-incompatible
  # way (ADR-0020, D16). The drift gate (V1OpenApiSnapshotTest, run in `build`)
  # already guarantees the committed artifact matches the code; this compares that
  # artifact against the base branch's and blocks removals / tightened params /
  # incompatible type changes. Skipped on the first introduction (no base spec).
  openapi-breaking-change:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Check whether the base branch has a spec yet
        id: base
        env:
          SPEC: website/public/api/tesseta-platform-v1.yaml
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          if git cat-file -e "origin/$GITHUB_BASE_REF:$SPEC" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No spec on $GITHUB_BASE_REF yet — first introduction, nothing to diff."
          fi

      - name: Detect breaking changes in the /v1 OpenAPI spec
        if: steps.base.outputs.exists == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: 'origin/${{ github.base_ref }}:website/public/api/tesseta-platform-v1.yaml'
          revision: 'HEAD:website/public/api/tesseta-platform-v1.yaml'
          fail-on: ERR
