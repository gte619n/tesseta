name: backend-ci

# CICD-001: always runs on pull_request to main (no top-level `paths:` gate) so
# it reports a conclusion on every PR and a branch ruleset can require it. The
# `changes` guard detects whether backend/ (or the published /v1 spec, or this
# workflow) was touched; heavy jobs `needs:` it and short-circuit to success
# when unchanged. The `backend-ci` aggregate job is the single stable check name
# the ruleset requires.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Detect backend changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'website/public/api/**'
              - '.github/workflows/backend-ci.yml'

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/**/*.gradle*', 'backend/**/gradle-wrapper.properties', 'backend/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # The Firestore-emulator integration tests (tag "firestore-emulator") boot
      # the emulator via the firebase CLI — no Docker. GitHub sets CI=true, which
      # flips firestore.emulator.required so a missing CLI fails the build rather
      # than silently skipping the integration suite.
      - name: Install firebase CLI
        run: npm install -g firebase-tools

      - name: Build (unit + emulator integration + coverage)
        run: ./gradlew build jacocoTestReport --no-daemon

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-jacoco
          path: backend/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: warn

  # Fail a PR that changes the published /v1 contract in a backward-incompatible
  # way (ADR-0020, D16). The drift gate (V1OpenApiSnapshotTest, run in `build`)
  # already guarantees the committed artifact matches the code; this compares that
  # artifact against the base branch's and blocks removals / tightened params /
  # incompatible type changes. Skipped on the first introduction (no base spec).
  openapi-breaking-change:
    name: openapi-breaking-change
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Check whether the base branch has a spec yet
        id: base
        env:
          SPEC: website/public/api/tesseta-platform-v1.yaml
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          if git cat-file -e "origin/$GITHUB_BASE_REF:$SPEC" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No spec on $GITHUB_BASE_REF yet — first introduction, nothing to diff."
          fi

      - name: Detect breaking changes in the /v1 OpenAPI spec
        if: steps.base.outputs.exists == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: 'origin/${{ github.base_ref }}:website/public/api/tesseta-platform-v1.yaml'
          revision: 'HEAD:website/public/api/tesseta-platform-v1.yaml'
          fail-on: ERR

  # Aggregate gate: one stable check name for the ruleset. Succeeds when the
  # component was unchanged (heavy jobs skipped) OR all heavy jobs passed; fails
  # if any heavy job failed. `if: always()` runs it even when upstream jobs skip.
  backend-ci:
    name: backend-ci
    needs: [changes, build, openapi-breaking-change]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on heavy job results
        run: |
          echo "build=${{ needs.build.result }} openapi=${{ needs.openapi-breaking-change.result }}"
          for r in "${{ needs.build.result }}" "${{ needs.openapi-breaking-change.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "A required backend job did not pass"; exit 1 ;;
            esac
          done
          echo "backend-ci gate passed"
