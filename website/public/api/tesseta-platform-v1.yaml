              schema:
                type: integer
                format: int32
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
                format: int32
            Retry-After:
              description: Seconds until the rate-limit window resets.
              schema:
                type: integer
                format: int32
      summary: List a day's doses
      tags:
      - Medications
