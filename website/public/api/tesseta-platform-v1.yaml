                $ref: "#/components/schemas/ProblemDetail"
          description: "The request has an invalid parameter (bad cursor, date, limit,\
            \ or filter value)."
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing, expired, or invalid access token."
        "403":
          content:
            application/problem+json:
