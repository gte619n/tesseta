openapi: 3.1.0
info:
  contact:
    email: api@tesseta.com
    name: Tesseta API Support
  description: "Read-only third-party access to a user's Tesseta data (workouts, nutrition,\
    \ medications & adherence, labs & metrics). User-delegated via OAuth 2.0 Authorization\
    \ Code + PKCE. List endpoints are keyset-paginated (`{data, nextCursor, hasMore}`)\
    \ and support incremental pull via `updatedSince`. Errors are RFC 7807 `application/problem+json`.\
    \ Scopes: profile:read, workouts:read, nutrition:read, medications:read, labs:read,\
    \ offline_access."
  license:
    name: Tesseta Platform API Terms
    url: https://tesseta.com/terms
  termsOfService: https://tesseta.com/terms
  title: Tesseta Platform API
  version: v1
externalDocs:
  description: Integration guide & rendered reference
  url: https://tesseta.com/api.html
servers:
- description: Production
  url: https://api.tesseta.com
- description: Same-origin (relative)
  url: /
security:
- tesseta-oauth: []
tags:
- description: "Blood readings, DEXA scans, body composition, and daily health metrics\
    \ — the most sensitive slice. Requires the `labs:read` scope."
  name: Labs & metrics
- description: Logged food entries and daily macro totals vs targets. Requires the
    `nutrition:read` scope.
  name: Nutrition
- description: "Medications, schedules, today's doses, and adherence — the highest-value\
    \ monitoring signal. Requires the `medications:read` scope."
  name: Medications
- description: Training programs and completed workout sessions with logged sets.
    Requires the `workouts:read` scope.
  name: Workouts
- description: The granted user's profile. Requires the `profile:read` scope.
  name: User
paths:
  /v1/adherence:
    get:
      description: "Per-day taken/skipped adherence across all medications, newest\
        \ first. Window defaults to the last 30 days (max 366)."
      operationId: adherence
      parameters:
      - description: Inclusive lower bound date (YYYY-MM-DD).
        in: query
        name: from
        required: false
        schema:
          type: string
      - description: Inclusive upper bound date (YYYY-MM-DD).
        in: query
        name: to
        required: false
        schema:
          type: string
      - description: Opaque pagination cursor from a prior page's `nextCursor`.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      - description: "Max items per page (default 50, max 200)."
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/V1PageAdherenceDto"
          description: OK
          headers:
            RateLimit-Limit:
              description: Request budget for the current fixed window.
              schema:
                type: integer
                format: int32
            RateLimit-Remaining:
              description: Requests remaining in the current window.
              schema:
                type: integer
                format: int32
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
                format: int32
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The request has an invalid parameter (bad cursor, date, limit,\
            \ or filter value)."
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing, expired, or invalid access token."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The access token is valid but lacks the scope this resource
            requires.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Per-client/per-user rate limit exceeded; see Retry-After.
          headers:
            RateLimit-Limit:
              description: Request budget for the current fixed window.
              schema:
                type: integer
                format: int32
            RateLimit-Remaining:
              description: Requests remaining in the current window.
              schema:
                type: integer
                format: int32
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
                format: int32
            Retry-After:
              description: Seconds until the rate-limit window resets.
              schema:
                type: integer
                format: int32
      summary: List adherence logs
      tags:
      - Medications
  /v1/doses:
