  securitySchemes:
    tesseta-oauth:
      description: Authorization Code + PKCE. Access tokens are RS256 JWTs; validate
        against /oauth/jwks.json. Discover endpoints at /.well-known/oauth-authorization-server.
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          refreshUrl: /oauth/token
          scopes:
            labs:read: "Your blood readings, DEXA scans, body composition, and daily\
              \ health metrics"
            medications:read: "Your medications, schedules, doses, and adherence"
            nutrition:read: "Your food log, macros, and daily nutrition totals"
            offline_access: Keep monitoring your data in the background when you're
              not using the app
            profile:read: Your name and height
            workouts:read: "Your training programs, scheduled and completed workouts,\
              \ and logged sets"
          tokenUrl: /oauth/token
      type: oauth2
