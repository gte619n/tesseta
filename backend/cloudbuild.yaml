steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    # Triggered builds check out the full repo at /workspace; dir scopes
    # the docker build context to /workspace/backend so the Dockerfile
    # resolves correctly. (Manual `gcloud builds submit backend/` uploads
    # just the subdir as /workspace, where this `dir` is a no-op.)
    dir: backend
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/health-fitness/backend:$SHORT_SHA
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/health-fitness/backend:latest
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - us-central1-docker.pkg.dev/$PROJECT_ID/health-fitness/backend

  # Vulnerability scan the image before it can ship. Fails the build on HIGH or
  # CRITICAL findings that have a fix available (--ignore-unfixed avoids blocking
  # on unfixable base-OS CVEs). Trivy authenticates to Artifact Registry via the
  # build SA's ambient GCP credentials.
  - id: scan-image
    name: aquasec/trivy:0.58.1
    args:
      - image
      - --severity=HIGH,CRITICAL
      - --ignore-unfixed
      - --exit-code=1
      - us-central1-docker.pkg.dev/$PROJECT_ID/health-fitness/backend:$SHORT_SHA

  # Canary deploy: bring the new revision up with a stable `candidate` tag but
  # ZERO traffic, so the live revision keeps serving until it's proven healthy.
  # ── PERF-002 / COST-001 — Option 2 APPLIED (operator decision, 2026-09-13) ──
  # The audit measured backend p95 startup 15.7s and ~$81/mo of mostly-idle
  # compute driven by `--no-cpu-throttling` + the sync keepalive. The Dockerfile
  # now adds Spring Boot CDS (targets startup <5s). The COST-001 async inventory
  # found all durable background work is on the Cloud Tasks rail and the remaining
  # fire-and-forget sites (nutrition image runAsync, Withings/Google-Health
  # webhook + backfill virtual threads, DrugCatalog cache warmers) are best-effort
  # — they run slower, not incorrectly, under CPU throttling. So we drop
  # `--no-cpu-throttling` and add `--min-instances=1`: warm always (~1.3s p50) AND
  # ≈ −$40 to −$55/mo vs today (a throttled idle instance bills per-request CPU +
  # idle memory only). ROLLBACK if a throttled background job regresses: re-add
  # `--no-cpu-throttling` (single flag, instant) and drop `--min-instances`.
  - id: deploy-candidate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - health-fitness-backend
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/health-fitness/backend:$SHORT_SHA
      - --region=us-central1
      - --platform=managed
      - --service-account=health-fitness-runtime@$PROJECT_ID.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --port=8080
      # Bring the revision up with no traffic under the `candidate` tag; the
      # promote step below smoke-tests it and only then shifts 100% traffic.
      - --no-traffic
      - --tag=candidate
      # Meal-photo capture runs Gemini analysis + studio-image generation, which
      # holds multi-MB images in memory; the default 512Mi OOM-kills the instance
      # mid-analysis, orphaning the in-memory finalize task (entry stuck ANALYZING
      # forever) and breaking image stores ("Broken pipe"). 2Gi gives headroom.
      - --memory=2Gi
      - --cpu=2
      # PERF-002/COST-001 Option 2: keep one warm instance so the first
      # dashboard/sync of the day skips the ~15.7s cold start (CDS in the
      # Dockerfile cuts the remaining startup). Detached studio-image generation
      # that formerly needed --no-cpu-throttling now runs on the Cloud Tasks rail
      # in prod (NUTRITION_JOBS_MODE=cloud-tasks below); the leftover best-effort
      # background threads tolerate throttling. Rollback: re-add
      # --no-cpu-throttling and drop --min-instances if a background job regresses.
      - --min-instances=1
      # Cap requests per instance well below the default 80: each meal capture
      # marshals multi-MB images (and spawns background image generation), so
      # packing dozens onto one instance is what blew past memory. At 16, Cloud
      # Run scales out more small instances instead of overloading one.
      - --concurrency=16
      # IMPL-02: CORS allow-list is the deployed web origin. IMPL-04:
      # GCP_PROJECT_ID makes the Firestore + KMS clients pick the right
      # project; GOOGLE_HEALTH_KMS_KEY pins the envelope-encryption key.
      # FIRESTORE_DATABASE_ID=production routes deployed reads/writes to a
      # separate Firestore database (created via `gcloud firestore databases
      # create --database=production`). Local dev runs against (default).
      # ADMIN_EMAILS is the @AdminOnly allowlist (AdminAuthorizer); without it
      # the allowlist falls back to the application.yml default and the rest of
      # the team can't reach admin endpoints. The custom list delimiter is `|`
      # (not `@`) because the email values themselves contain `@`.
      # PLATFORM_CONSENT_PAGE_URL (ADR-0020) is the browser-navigable consent
      # page on the web app, advertised as `authorization_endpoint` in the RFC
      # 8414 discovery doc. Without it, discovery falls back to the backend's
      # bearer-only JSON /oauth/authorize, so third-party clients send the user's
      # browser there and get a 401 (no session bearer on a raw navigation).
      # WITHINGS_CALLBACK_URL is the secret-free base the Withings notify
      # subscription posts to; the backend appends the webhook secret as
      # `?secret=` at subscribe time (see WithingsConnectController), so no
      # secret lives here. WITHINGS_CLIENT_ID/SECRET + WITHINGS_WEBHOOK_SECRET
      # come from Secret Manager below.
      - --set-env-vars=^|^GCP_PROJECT_ID=$PROJECT_ID|CORS_ALLOWED_ORIGINS=https://app.tesseta.com,https://health-fitness-web-mbysudfbja-uc.a.run.app|GOOGLE_HEALTH_KMS_KEY=projects/$PROJECT_ID/locations/us-central1/keyRings/auth/cryptoKeys/google-health-refresh-tokens|FIRESTORE_DATABASE_ID=production|ADMIN_EMAILS=evan.ruff@gmail.com,evan.ruff@oxos.com|EXERCISE_MEDIA_MODEL=gemini-3-pro-image|PLATFORM_CONSENT_PAGE_URL=https://app.tesseta.com/oauth/authorize|NUTRITION_JOBS_MODE=cloud-tasks|NUTRITION_JOBS_HANDLER_URL=https://api.tesseta.com/internal/nutrition/jobs|WITHINGS_CALLBACK_URL=https://api.tesseta.com/api/webhooks/withings
      # OAUTH_* feed the IMPL-02 JWT audience check and the IMPL-04
      # refresh-token exchange. GOOGLE_HEALTH_WEBHOOK_SECRET is the
      # shared secret Google sends in the Authorization header on push
      # notifications. SESSION_SIGNING_KEY is the HS256 key the backend uses
      # to mint native-client session access tokens (ADR-0010); without it the
      # resource server accepts Google tokens only and /api/auth/exchange 503s.
      # PLATFORM_RSA_KEY is the RS256 signing key for platform OAuth access tokens
      # (ADR-0020). PlatformKeys fails closed without it, so the service can't
      # start unless this is mounted. The runtime + CI service accounts are
      # granted secretAccessor on the secret.
      # WITHINGS_CLIENT_ID/SECRET redeem OAuth codes + refresh (rotating) tokens;
      # WITHINGS_WEBHOOK_SECRET authenticates the signature-less notify callback.
      - --set-secrets=OAUTH_ALLOWED_AUDIENCES=oauth-allowed-audiences:latest,OAUTH_WEB_CLIENT_ID=oauth-web-client-id:latest,OAUTH_WEB_CLIENT_SECRET=oauth-web-client-secret:latest,GOOGLE_HEALTH_WEBHOOK_SECRET=google-health-webhook-secret:latest,GEMINI_API_KEY=gemini_api_key:latest,SESSION_SIGNING_KEY=session-signing-key:latest,PLATFORM_RSA_KEY=platform-rsa-private-key:latest,NUTRITION_JOBS_SECRET=nutrition-jobs-secret:latest,WITHINGS_CLIENT_ID=withings-client-id:latest,WITHINGS_CLIENT_SECRET=withings-client-secret:latest,WITHINGS_WEBHOOK_SECRET=withings-webhook-secret:latest
      # Tier 3 durable nutrition jobs run on Cloud Tasks (enabled above via
      # NUTRITION_JOBS_MODE=cloud-tasks + the handler URL + the shared secret).
      # The queue + nutrition-jobs-secret + runtime-SA IAM are provisioned by
      # infra/scripts/bootstrap-nutrition-jobs.sh (run once per project). Keep the
      # queue's --max-attempts in sync with app.nutrition.jobs.max-attempts. To
      # roll back to the in-process executor, drop NUTRITION_JOBS_MODE (defaults
      # to local); the day-read reconcile sweep is the backstop either way.

  # Smoke-test the candidate revision and only then shift 100% traffic to it. A
  # failed health check leaves the previous revision serving (no bad deploy).
  - id: promote-canary
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    env:
      - PROJECT_ID=$PROJECT_ID
    args:
      - infra/scripts/canary-promote.sh
      - health-fitness-backend
      - us-central1
      - /actuator/health

  # IMPL-12 Phase 5: keep the goals-sustained-reeval Cloud Run Job's
  # image in sync with the deployed service. The Job re-uses the same
  # container image; only the image tag changes per commit.
  #
  # Bootstrap order: the Job must already exist before this step can
  # succeed. Run `bash infra/scripts/deploy-goals-sustained-job.sh` once
  # per project to create it. The `|| true` makes that bootstrap step
  # safe — fresh projects (or a deleted Job) will fail this update
  # cleanly without breaking the service deploy.
  - id: update-goals-sustained-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        # CICD-005: only tolerate a NOT-YET-PROVISIONED job (fresh project /
        # not bootstrapped). If the job exists, a failed image update is a real
        # error and must fail the build instead of silently stranding it on a
        # stale image (the blanket `|| true` used to hide that).
        if gcloud run jobs describe goals-sustained-reeval \
            --region=us-central1 --project=$PROJECT_ID >/dev/null 2>&1; then
          gcloud run jobs update goals-sustained-reeval \
            --image=us-central1-docker.pkg.dev/$PROJECT_ID/health-fitness/backend:$SHORT_SHA \
            --region=us-central1 \
            --project=$PROJECT_ID
        else
          echo "Cloud Run Job goals-sustained-reeval not provisioned; skipping image sync (bootstrap with its deploy-*-job.sh)."
        fi

  # Keep the gh-health-check Cloud Run Job's image in sync with the deployed
  # service, same as the goals job above. Bootstrap once per project with
  # `bash infra/scripts/deploy-gh-health-check-job.sh`; the `|| true` keeps
  # fresh projects (or a deleted Job) from breaking the service deploy.
  - id: update-gh-health-check-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        # CICD-005: tolerate a not-yet-provisioned job; surface real failures.
        if gcloud run jobs describe gh-health-check \
            --region=us-central1 --project=$PROJECT_ID >/dev/null 2>&1; then
          gcloud run jobs update gh-health-check \
            --image=us-central1-docker.pkg.dev/$PROJECT_ID/health-fitness/backend:$SHORT_SHA \
            --region=us-central1 \
            --project=$PROJECT_ID
        else
          echo "Cloud Run Job gh-health-check not provisioned; skipping image sync (bootstrap with its deploy-*-job.sh)."
        fi

  # Keep the gh-refresh Cloud Run Job's image in sync with the deployed
  # service, same as the jobs above. Bootstrap once per project with
  # `bash infra/scripts/deploy-gh-refresh-job.sh`; the `|| true` keeps
  # fresh projects (or a deleted Job) from breaking the service deploy.
  - id: update-gh-refresh-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        # CICD-005: tolerate a not-yet-provisioned job; surface real failures.
        if gcloud run jobs describe gh-refresh \
            --region=us-central1 --project=$PROJECT_ID >/dev/null 2>&1; then
          gcloud run jobs update gh-refresh \
            --image=us-central1-docker.pkg.dev/$PROJECT_ID/health-fitness/backend:$SHORT_SHA \
            --region=us-central1 \
            --project=$PROJECT_ID
        else
          echo "Cloud Run Job gh-refresh not provisioned; skipping image sync (bootstrap with its deploy-*-job.sh)."
        fi

  # Keep the withings-refresh Cloud Run Job's image in sync with the deployed
  # service, same as gh-refresh above. Bootstrap once per project with
  # `bash infra/scripts/deploy-withings-refresh-job.sh` (after
  # `bash infra/scripts/bootstrap-withings-secrets.sh`); the `|| true` keeps
  # fresh projects (or a deleted Job) from breaking the service deploy.
  - id: update-withings-refresh-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        # CICD-005: tolerate a not-yet-provisioned job; surface real failures.
        if gcloud run jobs describe withings-refresh \
            --region=us-central1 --project=$PROJECT_ID >/dev/null 2>&1; then
          gcloud run jobs update withings-refresh \
            --image=us-central1-docker.pkg.dev/$PROJECT_ID/health-fitness/backend:$SHORT_SHA \
            --region=us-central1 \
            --project=$PROJECT_ID
        else
          echo "Cloud Run Job withings-refresh not provisioned; skipping image sync (bootstrap with its deploy-*-job.sh)."
        fi

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/health-fitness/backend:$SHORT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/health-fitness/backend:latest

options:
  logging: CLOUD_LOGGING_ONLY
