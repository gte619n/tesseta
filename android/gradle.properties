# Build-JVM sizing/GC. 6g headroom keeps release lint-vital + R8/dex off the GC
# ceiling (CI runs on 32 GB E2_HIGHCPU_32; dev machines have more). ParallelGC
# is the throughput collector — measurably faster than the default G1 for
# short-lived build daemons. The Kotlin daemon inherits neither, so size it
# explicitly or it falls back to a small default heap and thrashes.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx4g -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Configure decoupled projects concurrently when the configuration cache misses
# (incubating in Gradle 8.11; all modules go through build-logic conventions).
org.gradle.configuration-cache.parallel=true
android.useAndroidX=true
kotlin.code.style=official
