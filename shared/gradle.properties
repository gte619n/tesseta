# IMPL-IOS-01 — shared (KMP) build tuning.
#
# Kotlin/Native RELEASE linking of the iOS frameworks is memory-hungry; the
# default JVM heap OOMs on the optimized iosArm64 link (the debug link, which is
# unoptimized, succeeds — so this is purely a heap ceiling, not a code issue).
# The build hosts run with ample RAM, so give the compiler room.
org.gradle.jvmargs=-Xmx10g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx8g

# Standard KMP hygiene.
kotlin.code.style=official
org.gradle.caching=true
